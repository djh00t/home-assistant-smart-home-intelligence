version: 0.1.0
site: smart_home_presence_intelligence
description: Synthetic sample room capability catalog for public lighting, sensing, and policy routing examples.

room_capabilities:
  - room_id: sample_room_alpha
    occupancy_sources:
      - mmwave
      - motion
      - face
    lighting:
      supports_lighting: true
      supports_color: false
      white_groups:
        - group_white_sleep_a
      color_groups: []
      default_day_scene: scene_day_sleep_a
      default_night_scene: scene_night_sleep_a
    policies:
      manual_override_minutes: 120
      person_only_actions: true
      pet_only_actions: false

  - room_id: sample_room_beta
