      - mmwave
      - motion
      - frigate

  - room_id: kitchen
    display_name: Kitchen
    room_type: room
    level: ground_floor
    supports_occupancy: true
    supports_lighting: true
    source_priority:
      - motion
      - mmwave
      - frigate

  - room_id: living_room
    display_name: Living Room
    room_type: room
    level: ground_floor
    supports_occupancy: true
    supports_lighting: true
    source_priority:
      - mmwave
      - motion
      - frigate

  - room_id: office
    display_name: Office
    room_type: room
    level: ground_floor
    supports_occupancy: true
    supports_lighting: true
    source_priority:
      - tracker
      - mmwave
      - motion
      - face

  - room_id: master_bedroom
    display_name: Master Bedroom
    room_type: room
    level: upper_floor
    supports_occupancy: true
    supports_lighting: true
    source_priority:
      - mmwave
      - motion
      - face

external_zones:
