version: 0.1
site: smart_home_presence_intelligence
description: Phase 0 room and zone inventory for presence, lighting, and vehicle-aware automations.

rooms:
  - room_id: hall
    display_name: Hall
    room_type: room
    level: ground_floor
    supports_occupancy: true
    supports_lighting: true
