version: 0.1.0
description: Normalization contract for presence events before they are published to the canonical MQTT topic.

canonical_topic: ha/presence/event
dead_letter_topic: ha/presence/event/dlq

source_aliases:
  mwave: mmwave

room_aliases:
  hall: lounge_room
  living_room: lounge_room
  office: bedroom_spare
  master_bedroom: bedroom_master

required_fields:
  - event_id
  - source
  - type
  - room
  - entity_class
  - confidence
  - ts
