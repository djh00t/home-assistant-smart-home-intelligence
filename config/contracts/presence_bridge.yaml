version: 0.1.0
description: Normalization contract for presence events before they are published to the canonical MQTT topic.

canonical_topic: ha/presence/event
dead_letter_topic: ha/presence/event/dlq

source_aliases:
  mwave: mmwave

room_aliases: {}

required_fields:
  - event_id
  - source
  - type
  - room
  - entity_class
  - confidence
  - ts

outbound_allowed_fields:
  - event_id
  - source
  - type
  - room
  - camera
  - entity_class
  - person_ref
  - confidence
  - tracker_ref
  - vehicle
  - context
  - ts

dead_letter_payload_policy: contract_field_subset
event_id_policy: opaque_or_rekeyed
identity_redaction:
  resident_ids: opaque_sha256_ref
  tracker_ids: opaque_sha256_ref
  license_plates: opaque_sha256_ref
