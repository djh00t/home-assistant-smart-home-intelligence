version: 0.3.0
description: ANPR zone_alpha vehicle event normalization for phase 3 planning.

scope:
  behavior: canonicalization_only
  backlog_boundary:
    - no_face_linkage
    - no_foreign_plate_queue
    - no_vehicle_person_linking

inputs:
  required:
    - room_id
    - plate
    - plate_confidence
    - camera
  optional:
    - direction
    - vehicle_type

normalization:
  canonical_room_id: zone_alpha
  source: anpr
  entity_class: vehicle
  room_reference_required: true
  plate_transform: uppercase_strip_separators
  plate_confidence_range: [0.0, 1.0]
  vehicle_type_fallback: unknown

direction:
  fallback: stationary
  mapping_source: zone_alpha_zone_setup

output:
  include_fields:
    - event_id
    - source
    - type
    - room
    - entity_class
    - confidence
    - camera
    - vehicle
    - ts
  canonical_event:
    source: anpr
    entity_class: vehicle
    room: zone_alpha
  fallback_event_id_mode: opaque_sha256_digest
  fallback_event_id_format: anpr_event::sha256:{event_digest}
  fallback_event_id_exposes_plate: false
  upstream_event_id_passthrough: false
