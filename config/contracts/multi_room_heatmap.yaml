version: 0.4.0
description: Deterministic planning-only multi-room heatmap report for phase 4 occupancy review.

scope:
  behavior: deterministic_multi_room_heatmap
  planning_only: true
  backlog_boundary:
    - no_actuation
    - no_room_control
    - no_light_control
    - no_schedule_writes

input:
  required:
    - observations
  observation_fields:
    required:
      - room_id
      - confidence
    optional:
      - room
      - zone_id
      - source
      - type
      - event_id
      - ts

normalization:
  canonical_room_inventory: config/inventory/rooms.yaml
  room_reference_required: true
  eligible_room_type: room
  supports_occupancy_required: true
  ignore_non_occupancy_rooms: true
  sort_by: room_id

output:
  include_fields:
    - source
    - report_id
    - report_record_type
    - record_name
    - report_status
    - heatmap_cells
    - summary
    - retention
  report_record_type: room_heatmap
  record_name: multi_room_heatmap
  report_status: ready
  retention_days: 14
  immutable: true
  report_id_digest: sha256_canonical_json
  report_id_format: multi_room_heatmap::sha256:{report_digest}
  report_id_raw_telemetry: false
  per_room_provenance_retained: false
  per_room_timestamp_detail: omitted
  report_level_input_timestamp_retained: false
