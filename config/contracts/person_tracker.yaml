version: 0.2.0
description: Person tracker integration contract for phase 2.

sources:
  - mobile_app
  - ble
  - geofencing

states:
  - home
  - not_home
  - arriving
  - leaving

required_fields:
  - tracker_id
  - person_id
  - source
  - state
  - confidence

output:
  fallback_event_id_mode: opaque_sha256_digest
  fallback_event_id_exposes_tracker_id: false
  supplied_event_id_mode: opaque_or_rekeyed
  person_reference_mode: opaque_sha256_ref
  tracker_reference_mode: opaque_sha256_ref
